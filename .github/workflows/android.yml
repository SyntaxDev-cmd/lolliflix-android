name: Build LOLLIFLIX PRO APK

# Gera o APK na nuvem (sem Android Studio).
# Suba a PASTA "doraflix" como RAIZ do repositorio (o .github fica na raiz).
# Actions > "Build LOLLIFLIX PRO APK" > Run workflow. Baixe em Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquivos
        run: ls -la
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund --omit=optional
      - name: Adicionar plataforma Android
        run: npx cap add android
      - name: Forcar orientacao PAISAGEM (AndroidManifest)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:screenOrientation="sensorLandscape"#' "$MF"
          grep -n "MainActivity" "$MF" || true
      - name: Gerar icones e splash (opcional)
        run: npx --yes @capacitor/assets@3 generate --android || echo "assets ignorado"
      - name: Sincronizar (cap sync)
        run: npx cap sync android
      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LOLLIFLIX-PRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
